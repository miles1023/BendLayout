name: Android CI (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # Install Android SDK cmdline-tools and set ANDROID_HOME/ANDROID_SDK_ROOT
      - name: Set up Android SDK (cmdline-tools only)
        uses: android-actions/setup-android@v3

      # Install required SDK packages explicitly (no newline parsing issues)
      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list | sed -n '1,80p'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release (unsigned) APK & AAB
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :app:bundleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BendLayout-artifacts
          path: |
            app/build/outputs/apk/**/app-*.apk
            app/build/outputs/bundle/**/app-*.aab
          if-no-files-found: error
